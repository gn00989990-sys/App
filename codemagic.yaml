workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install npm dependencies
        script: | 
          npm install
      - name: Cocoapods installation
        script: | 
          cd ios/App && pod install
      - name: Building iOS Project
        script: | 
          xcodebuild build -workspace ios/App/App.xcworkspace -scheme App -codegenStyle Automatic
    artifacts:
      - ios/App/build/*.ipa
      - /tmp/xcodebuild_logs/*.log
