workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: "Kid Learning"   # name of the App Store Connect integration you create in Codemagic UI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fafa.kidlearning
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.fafa.kidlearning"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Capacitor iOS package
        script: |
          # No package.json is committed in this repo, so create a minimal one
          # and install the @capacitor/ios package the Podfile depends on.
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/ios --save-exact
