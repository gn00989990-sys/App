workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key   # name of the App Store Connect integration you create in Codemagic UI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fafa.kidlearning
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Capacitor iOS package
        script: |
          # No package.json is committed in this repo, so create a minimal one
          # and install the @capacitor/ios package the Podfile depends on.
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/ios --save-exact

      - name: Fix Podfile path to node_modules
        script: |
          # The Podfile expects ../../node_modules (as if it lived two levels
          # deep inside a full Capacitor project). Since it actually sits at
          # the repo root here, point it at ./node_modules instead.
          sed -i '' 's#\.\./\.\./node_modules#./node_modules#g' Podfile

      - name: Install CocoaPods dependencies
        script: |
          pod install

      - name: Set up code signing certificates and profiles
        script: |
          xcode-project use-profiles

      - name: Ensure Xcode scheme is available
        script: |
          # No shared .xcscheme is committed, so force Xcode to resolve/
          # generate one before archiving. If this step lists no schemes,
          # you'll need to open the project in Xcode once and commit
          # App.xcworkspace/xcshareddata/xcschemes/App.xcscheme.
          xcodebuild -workspace "$XCODE_WORKSPACE" -list

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: false
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
