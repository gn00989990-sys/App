workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: "Kid Learning"   # name of the App Store Connect integration you create in Codemagic UI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fafa.kidlearning
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.fafa.kidlearning"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Capacitor iOS package
        script: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/ios --save-exact
      - name: Fix Podfile path to node_modules
        script: |
          sed -i '' 's#\.\./\.\./node_modules#./node_modules#g' Podfile
      - name: Install CocoaPods dependencies
        script: |
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Ensure Xcode scheme is available
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" -list
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - aa5623@hotmail.com
        notify:
          success: true
          failure: false
      app_store_connect:
        auth: integration
        submit_to_testflight: true
